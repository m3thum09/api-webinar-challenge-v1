name: Challenge Submission
description: Submit your completed challenge for evaluation
title: "[SUBMISSION]: Team Submission"
labels: ["submission"]
body:
  - type: input
    id: team_number
    attributes:
      label: Team Number
      description: Enter your assigned team number (e.g., team-01)
      placeholder: team-01
    validations:
      required: true
  - type: input
    id: dockerhub_user
    attributes:
      label: Docker Hub Username
      description: Enter the Docker Hub username where images were published
      placeholder: mydockerhubuser
    validations:
      required: true