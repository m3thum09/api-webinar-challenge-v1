version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: challenge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: challenge_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: devops_db

  frontend:
    build: ./frontend
    container_name: challenge_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend